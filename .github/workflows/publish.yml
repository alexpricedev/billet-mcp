name: Publish

# Publishes @alexpricedev/billet-mcp to npm when a version tag is pushed:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# npm trusted publishing (OIDC) authenticates the publish, so no npm token is
# stored anywhere, and npm adds provenance automatically.

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: Tag matches package.json, commit is on main, not yet on npm
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(jq -r .version package.json)"
          if [ "$want" != "$have" ]; then
            echo "::error::Tag says $want but package.json says $have. Bump the version first."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not on main. Tag a commit that has been merged."
            exit 1
          fi
          if [ "$(npm view "@alexpricedev/billet-mcp@$have" version 2>/dev/null)" = "$have" ]; then
            echo "::error::@alexpricedev/billet-mcp@$have is already on npm."
            exit 1
          fi
          echo "version=$have" >> "$GITHUB_OUTPUT"

  publish:
    name: Check, build and publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: billet_mcp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billet_mcp_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - run: bun install --frozen-lockfile
      # prepublishOnly runs `bun run check` (typecheck and tests, against the
      # Postgres service above) and `bun run build` before anything is uploaded.
      - run: npm publish
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" --title "billet-mcp $VERSION" --generate-notes
